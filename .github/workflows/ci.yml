name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # GitHub-hosted, since the repo is public: macOS 27 with Xcode 27, which the
    # deployment target needs. The image is a preview until GitHub makes it GA.
    runs-on: xcode-27
    # A backstop for a wedged xcodebuild rather than a budget for a slow build,
    # so a hang does not run to GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: brew bundle

      # Mint builds SwiftLint and SwiftFormat from source, which costs minutes on
      # every cold run. The Mintfile pins both, so it is the whole cache key.
      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}

      - name: Install pinned Mint packages
        run: mint bootstrap

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # Lint runs before the build, not after it. `if: '!cancelled()'` on a later
      # step does not survive a *job* timeout, since GitHub cancels the whole job
      # and no later step starts. Linting first costs seconds and always reports;
      # the condition moves onto the test step so a lint failure still lets the
      # tests run and neither signal masks the other.
      - name: Lint
        run: just lint

      # A RUSTUP_HOME of its own, so the cache holds just the toolchain that
      # Engine/rust-toolchain.toml pins, not the image's. rustup installs it on
      # the first cargo call.
      - name: Point Rust caches
        if: '!cancelled()'
        run: echo "RUSTUP_HOME=$HOME/.rustup-engine" >> "$GITHUB_ENV"

      # Of CARGO_HOME, only the downloaded crates: the registry's index and
      # archives (not `src/`, which cargo unpacks from them) and `git/`, never
      # `.global-cache`, which is cargo's own SQLite bookkeeping. `target/` makes
      # a run without dependency changes rebuild only the engine crate, and the
      # restore key keeps most of it when the lockfile changes.
      - name: Cache Rust toolchain and crates
        if: '!cancelled()'
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup-engine
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            Engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('Engine/rust-toolchain.toml', 'Engine/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build engine
        if: '!cancelled()'
        run: just engine

      - name: Check engine bindings
        if: '!cancelled()'
        run: |
          if [ -n "$(git status --porcelain -- Sources/Engine)" ]; then
            git diff -- Sources/Engine
            echo "::error::The engine bindings are stale: run \`just engine\` and commit the bindings."
            exit 1
          fi

      - name: Build and test
        if: '!cancelled()'
        run: just test
