[workspace]
# The bindgen binary is its own crate so only it enables `uniffi/cli`. Built in the same package,
# the feature reached the library too and shipped the whole generator in libengine.a.
members = ["uniffi-bindgen"]

[workspace.dependencies]
# Exact, so the bindgen binary and the runtime it generates against never drift.
uniffi = "=0.32.2"

[package]
name = "engine"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# Must match the `rusqlite` taskchampion pins: `links = "sqlite3"` allows one `libsqlite3-sys`.
# No `bundled`, so the process links the system libsqlite3 and holds one SQLite.
rusqlite = "0.39"
# The minor Homebrew's Taskwarrior links, so the app and the CLI share a schema.
taskchampion = { version = "~3.1.0", default-features = false, features = ["storage-sqlite"] }
tokio = { version = "1", features = ["rt"] }
uniffi = { workspace = true }
